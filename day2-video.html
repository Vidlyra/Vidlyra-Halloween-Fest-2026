<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidlyra Halloween Fest 2026 | Day 2</title>
<link rel="stylesheet" href="css/day2-video.css">
</head>
<body>
<!-- ==========================
START SCREEN
========================== -->
<div id="startScreen">
    <h1>🎃 VIDLYRA HALLOWEEN FEST 2026</h1>
    <h2>DAY 2</h2>
    <p>The Haunted Well</p>
    <button id="startBtn">
        ▶ Start Experience
    </button>
</div>
<!-- ==========================
VIDEO
========================== -->
<video
id="introVideo"
playsinline
preload="auto">
    <source
    src="assets/video/haunted-well.mp4"
    type="video/mp4">
    Your browser does not support HTML5 video.
</video>
<!-- ==========================
SKIP BUTTON
========================== -->
<button id="skipBtn">
Skip Intro
</button>
<!-- ==========================
OVERLAY
========================== -->
<div id="videoOverlay">
    <h1>DAY 2</h1>
    <h2>The Haunted Well</h2>
    <p>
        Some secrets should remain buried forever...
    </p>
    <button id="enterWell">
        Enter the Well
    </button>
</div>
<!-- ==========================
VIDEO ERROR
========================== -->
<div id="videoError">
    <h1>Something went wrong</h1>
    <p>
        The Day 2 intro couldn't load. Check your connection and try again, or head back to the map.
    </p>
    <button onclick="window.location.href='map.html'">
        Back to Map
    </button>
</div>
<script type="module" src="js/day2-video.js"></script>

</html>
