```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        VidLyra Halloween Fest 2026 | Day 1
    </title>

    <link
        rel="stylesheet"
        href="css/day1.css"
    >

</head>

<body>

    <main class="game" id="game">

        <!-- Background -->
        <div class="stars"></div>
        <div class="fog"></div>

        <!-- Header -->
        <header class="header">

            <div class="brand">
                VIDLYRA
            </div>

            <div class="event">
                HALLOWEEN FEST 2026
            </div>

        </header>


        <!-- Day Label -->
        <div class="day-label">
            DAY 01 • THE CURSED GATE
        </div>


        <!-- Main Title -->
        <section class="title">

            <h1>
                THE CURSED GATE
            </h1>

            <p>
                ONE SYMBOL HOLDS THE KEY
            </p>

        </section>


        <!-- Gate -->
        <section
            class="gate-area"
            id="gateArea"
        >

            <div class="gate">

                <div class="door">

                    <div class="lock">
                    </div>

                </div>

            </div>

        </section>


        <!-- Message -->
        <section
            class="message"
            id="message"
        >

            <h2 id="messageTitle">
                The gate watches...
            </h2>

            <p id="messageText">
                Find the symbol that does not belong.
            </p>

        </section>


        <!-- Challenge -->
        <section
            class="symbol-panel"
            id="symbolPanel"
        >

            <p class="instruction">
                FIND THE DIFFERENT SYMBOL
            </p>

            <div class="symbols">

                <button
                    class="symbol"
                    data-correct="false"
                    aria-label="Symbol 1"
                >
                    ✦
                </button>

                <button
                    class="symbol"
                    data-correct="false"
                    aria-label="Symbol 2"
                >
                    ✦
                </button>

                <button
                    class="symbol"
                    data-correct="true"
                    aria-label="Symbol 3"
                >
                    ✧
                </button>

                <button
                    class="symbol"
                    data-correct="false"
                    aria-label="Symbol 4"
                >
                    ✦
                </button>

            </div>

        </section>


        <!-- Portal -->
        <div
            class="portal"
            id="portal"
        ></div>


        <!-- Day 2 Button -->
        <button
            class="continue"
            id="continueBtn"
        >
            ENTER DAY 2 →
        </button>


        <!-- Flash -->
        <div
            class="flash"
            id="flash"
        ></div>

    </main>


    <script src="js/day1.js"></script>

</body>

</html>
```
