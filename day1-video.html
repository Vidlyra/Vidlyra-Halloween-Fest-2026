<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VIDLYRA HALLOWEEN FEST 2026 — DAY 1</title>

    <link rel="stylesheet" href="css/day1-video.css">
</head>

<body>

    <main class="video-page">

        <!-- Loading -->
        <div id="loadingScreen" class="loading-screen">
            <div class="loading-title">VIDLYRA</div>
            <div class="loading-subtitle">
                HALLOWEEN FEST 2026
            </div>

            <div class="loading-bar">
                <div id="loadingFill"></div>
            </div>

            <div id="loadingPercent">0%</div>
        </div>

        <!-- Video -->
        <video
            id="day1Video"
            class="day-video"
            playsinline
            preload="auto"
            controls
        >
            <source src="assets/video/day1-video.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>

        <!-- Video error -->
        <div id="videoError" class="video-error">
            <h2>DAY 1 VIDEO NOT FOUND</h2>
            <p>
                Check that your video exists at:
            </p>

            <code>assets/videos/day1.mp4</code>
        </div>

        <!-- End overlay -->
        <div id="endOverlay" class="end-overlay">

            <div class="end-box">

                <div class="end-symbol">🎃</div>

                <h1>DAY 1 COMPLETE</h1>

                <p>
                    The journey has begun.
                </p>

                <button id="continueButton">
                    ENTER DAY 2
                </button>

            </div>

        </div>

        <!-- Skip / Continue -->
        <button id="skipButton" class="skip-button">
            SKIP VIDEO
        </button>

    </main>

    <script src="js/day1-video.js"></script>

</body>
</html>
