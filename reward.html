<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mission Complete</title>

<link rel="stylesheet" href="css/reward.css">
<link rel="stylesheet" href="css/reward-animations.css">

</head>

<body>

<div class="background"></div>

<div class="background-layer"></div>

<div class="fog"></div>

<section class="reward-card">

    <h1>🎉 Mission Complete!</h1>

    <h2>Day 1 Cleared</h2>

    <div class="xp-box">

        +100 XP

    </div>

    <div class="stats">

        <p>Total XP</p>

        <h3 id="totalXP">0</h3>

    </div>

    <div class="unlock">

        🔓 Day 2 Unlocked

    </div>

    <button id="mapBtn">

        Return to Event Map

    </button>

</section>

<audio id="rewardMusic">

    <source src="assets/reward.mp3" type="audio/mpeg">

</audio>

<script src="js/reward.js"></script>

</body>

</html>
