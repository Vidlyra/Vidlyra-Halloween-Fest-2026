<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Vidlyra Halloween Fest 2026 | Event Map</title>

<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/map-animations.css">
<link rel="stylesheet" href="css/map-responsive.css">

</head>

<body>

<!-- Background -->
<div class="background"></div>
<div class="background-layer"></div>

<!-- Clouds -->
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<!-- Castle -->
<div class="castle"></div>

<!-- Forest -->
<img src="assets/images/forest.svg.png"
class="forest"
alt="Forest">

<!-- Fog -->
<div class="fog fog-back"></div>
<div class="fog fog-front"></div>

<!-- Hero -->

<section class="hero">

<h1>VIDLYRA</h1>

<h2>Halloween Fest 2026</h2>

<p>

Choose your destination...

</p>

</section>

<!-- Event Path -->

<section class="event-map">

<div class="path"></div>

<div class="node active">

<div class="circle">

1

</div>

<p>Day 1</p>

</div>

<div class="node locked">

<div class="circle">

2

</div>

<p>Day 2</p>

</div>

<div class="node locked">

<div class="circle">

3

</div>

<p>Day 3</p>

</div>

<div class="node locked">

<div class="circle">

4

</div>

<p>Day 4</p>

</div>

<div class="node locked">

<div class="circle">

🏰

</div>

<p>Final</p>

</div>

</section>

<script src="js/map.js"></script>

</body>

</html>
