<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIDLYRA HALLOWEEN FEST 2026 — DAY 6</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050309;
    font-family:Georgia, "Times New Roman", serif;
}

/* ================================
   VIDEO CONTAINER
================================ */

.video-screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#050309;
}

/* ================================
   VIDEO
================================ */

#day6Video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#050309;
}

/* Dark cinematic layer */

.video-screen::after{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.35) 70%,
            rgba(0,0,0,.85) 100%
        );
}

/* ================================
   DAY LABEL
================================ */

.day-label{
    position:absolute;

    top:30px;
    left:50%;

    transform:translateX(-50%);

    z-index:5;

    color:#eee;

    font-size:13px;
    letter-spacing:6px;

    text-align:center;

    opacity:.85;

    text-shadow:
        0 0 8px #000,
        0 0 20px #000;

    transition:
        opacity .8s ease,
        transform .8s ease;
}

.day-label.hidden{
    opacity:0;
    transform:
        translateX(-50%)
        translateY(-20px);
}

/* ================================
   INTRO TITLE
================================ */

.intro-title{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.92);

    z-index:6;

    text-align:center;

    color:white;

    opacity:0;

    pointer-events:none;

    animation:
        titleReveal 2.5s ease forwards;

    animation-delay:.5s;
}

.intro-title .day{
    display:block;

    font-size:15px;

    letter-spacing:8px;

    margin-bottom:18px;

    opacity:.75;
}

.intro-title h1{
    font-size:clamp(
        38px,
        8vw,
        110px
    );

    letter-spacing:10px;

    font-weight:400;

    text-shadow:
        0 0 12px rgba(255,255,255,.25),
        0 0 35px rgba(80,0,100,.7),
        0 0 80px rgba(0,0,0,1);
}

@keyframes titleReveal{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

    35%{
        opacity:1;
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}

/* ================================
   LOADING
================================ */

.loading{
    position:absolute;

    left:50%;
    bottom:35px;

    transform:translateX(-50%);

    z-index:8;

    color:#aaa;

    font-size:11px;

    letter-spacing:4px;

    opacity:.8;

    transition:opacity .6s ease;
}

.loading.hidden{
    opacity:0;
}

/* ================================
   END SCREEN
================================ */

.end-screen{
    position:absolute;

    inset:0;

    z-index:20;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    text-align:center;

    background:
        radial-gradient(
            ellipse at center,
            rgba(35,10,45,.65),
            rgba(0,0,0,.97) 75%
        );

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transition:
        opacity 1.5s ease,
        visibility 1.5s ease;
}

.end-screen.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

/* ================================
   END TEXT
================================ */

.end-day{
    color:#aaa;

    font-size:12px;

    letter-spacing:7px;

    margin-bottom:20px;
}

.end-screen h2{
    color:white;

    font-size:clamp(
        35px,
        8vw,
        90px
    );

    font-weight:400;

    letter-spacing:8px;

    margin-bottom:20px;

    text-shadow:
        0 0 15px rgba(255,255,255,.25),
        0 0 40px rgba(80,0,100,.8);
}

.end-screen p{
    color:#aaa;

    max-width:600px;

    padding:0 25px;

    font-size:14px;

    line-height:1.8;

    letter-spacing:2px;

    margin-bottom:35px;
}

/* ================================
   CONTINUE BUTTON
================================ */

.continue-btn{

    border:1px solid rgba(255,255,255,.35);

    background:rgba(255,255,255,.04);

    color:white;

    padding:15px 32px;

    font-family:inherit;

    font-size:12px;

    letter-spacing:4px;

    cursor:pointer;

    transition:
        background .3s ease,
        box-shadow .3s ease,
        transform .3s ease;
}

.continue-btn:hover{
    background:rgba(255,255,255,.12);

    box-shadow:
        0 0 25px rgba(150,80,180,.35);

    transform:translateY(-2px);
}

/* ================================
   SKIP / PLAY BUTTON
================================ */

.play-button{
    position:absolute;

    left:50%;
    bottom:80px;

    transform:translateX(-50%);

    z-index:10;

    border:1px solid rgba(255,255,255,.3);

    background:rgba(0,0,0,.45);

    color:#fff;

    padding:12px 25px;

    font-family:inherit;

    font-size:11px;

    letter-spacing:3px;

    cursor:pointer;

    opacity:.85;

    transition:.3s ease;
}

.play-button:hover{
    background:rgba(255,255,255,.12);
}

.play-button.hidden{
    opacity:0;
    pointer-events:none;
}

/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    .day-label{
        top:20px;
        font-size:9px;
        letter-spacing:4px;
    }

    .intro-title .day{
        font-size:10px;
        letter-spacing:5px;
    }

    .intro-title h1{
        font-size:38px;
        letter-spacing:5px;
    }

    .end-screen h2{
        font-size:36px;
        letter-spacing:4px;
    }

    .end-screen p{
        font-size:12px;
    }

    .continue-btn{
        padding:13px 24px;
    }
}
</style>
</head>

<body>

<div class="video-screen">

    <!-- =========================
         DAY 6 VIDEO
    ========================== -->

    <video
        id="day6Video"
        playsinline
        preload="auto"
        muted
        poster="assets/images/day6/haunted-mansion-poster.jpg">

        <source
            src="assets/video/day6-haunted-mansion.mp4"
            type="video/mp4">

        Your browser does not support HTML5 video.
    </video>


    <!-- =========================
         DAY LABEL
    ========================== -->

    <div
        id="dayLabel"
        class="day-label">

        VIDLYRA HALLOWEEN FEST 2026
        <br>
        DAY 6

    </div>


    <!-- =========================
         INTRO
    ========================== -->

    <div class="intro-title">

        <span class="day">
            VIDLYRA HALLOWEEN FEST 2026
        </span>

        <h1>
            HAUNTED MANSION
        </h1>

    </div>


    <!-- =========================
         LOADING
    ========================== -->

    <div
        id="loading"
        class="loading">

        ENTERING THE MANSION...

    </div>


    <!-- =========================
         PLAY BUTTON
    ========================== -->

    <button
        id="playButton"
        class="play-button">

        ENTER

    </button>


    <!-- =========================
         END SCREEN
    ========================== -->

    <div
        id="endScreen"
        class="end-screen">

        <div class="end-day">
            VIDLYRA HALLOWEEN FEST 2026
            <br>
            DAY 6
        </div>

        <h2>
            THE MANSION AWAITS
        </h2>

        <p>
            The doors have opened.
            Something inside is waiting.
        </p>

        <button
            id="continueButton"
            class="continue-btn">

            ENTER THE MANSION

        </button>

    </div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const video =
    document.getElementById("day6Video");

const playButton =
    document.getElementById("playButton");

const loading =
    document.getElementById("loading");

const dayLabel =
    document.getElementById("dayLabel");

const endScreen =
    document.getElementById("endScreen");

const continueButton =
    document.getElementById("continueButton");


/* =========================================
   VIDEO START
========================================= */

function startVideo(){

    video.play()
    .then(()=>{

        playButton.classList.add("hidden");

        loading.classList.add("hidden");

    })
    .catch(()=>{

        playButton.classList.remove("hidden");

        loading.textContent =
            "PRESS ENTER TO BEGIN";

    });

}


/* =========================================
   ENTER BUTTON
========================================= */

playButton.addEventListener(
    "click",
    startVideo
);


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.code === "Enter" ||
            event.code === "Space"
        ){

            if(video.paused){

                startVideo();

            }

        }

    }
);


/* =========================================
   VIDEO PLAY
========================================= */

video.addEventListener(
    "play",
    function(){

        playButton.classList.add("hidden");

        loading.classList.add("hidden");

    }
);


/* =========================================
   HIDE DAY LABEL
========================================= */

video.addEventListener(
    "timeupdate",
    function(){

        if(video.currentTime > 3){

            dayLabel.classList.add("hidden");

        }

    }
);


/* =========================================
   VIDEO ENDED
========================================= */

video.addEventListener(
    "ended",
    function(){

        endScreen.classList.add("show");

    }
);


/* =========================================
   CONTINUE TO DAY 6 GAME
========================================= */

continueButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "day6-epic-game.html";

    }
);


/* =========================================
   AUTOPLAY ATTEMPT
========================================= */

window.addEventListener(
    "load",
    function(){

        startVideo();

    }
);

</script>

</body>
</html>
