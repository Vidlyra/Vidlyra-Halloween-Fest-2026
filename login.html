<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Vidlyra Halloween Fest 2026</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --orange:#ff6b22;
    --orange2:#ff9a4d;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    color:#fff;
    background:#030303;
}

/* BACKGROUND */

.background{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,91,25,.16),
            transparent 28%
        ),
        radial-gradient(
            circle at 10% 100%,
            rgba(255,60,10,.09),
            transparent 30%
        ),
        #030303;
}

.background::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            115deg,
            transparent 20%,
            rgba(255,100,30,.025),
            transparent 80%
        );
}

/* PARTICLES */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#ff7b35;

    box-shadow:
        0 0 10px #ff6b22;

    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(105vh);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    85%{
        opacity:.8;
    }

    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

/* HEADER */

.topbar{
    position:fixed;

    top:0;
    left:0;

    width:100%;

    padding:24px 34px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:10;
}

.logo{
    font-size:17px;
    font-weight:900;
    letter-spacing:5px;
}

.logo span{
    color:var(--orange);
}

.event{
    color:rgba(255,255,255,.4);

    font-size:9px;
    font-weight:800;

    letter-spacing:3px;
}

/* PAGE */

.page{
    position:relative;
    z-index:5;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:80px 20px;
}

/* LOGIN CARD */

.card{
    width:min(430px,100%);

    padding:34px;

    background:
        linear-gradient(
            145deg,
            rgba(30,30,30,.88),
            rgba(7,7,7,.9)
        );

    border:1px solid rgba(255,255,255,.11);

    backdrop-filter:blur(25px);

    box-shadow:
        0 30px 90px rgba(0,0,0,.65),
        0 0 70px rgba(255,70,20,.07);

    position:relative;
}

.card::before{
    content:"";

    position:absolute;

    top:-1px;
    left:15%;

    width:70%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--orange),
            transparent
        );
}

.badge{
    display:inline-block;

    padding:7px 10px;

    border:1px solid rgba(255,100,40,.25);

    color:var(--orange2);

    font-size:8px;
    font-weight:900;

    letter-spacing:2px;
}

h1{
    margin-top:18px;

    font-size:34px;

    line-height:1;

    letter-spacing:-1px;

    font-weight:900;
}

.subtitle{
    margin-top:10px;

    color:rgba(255,255,255,.4);

    font-size:11px;

    line-height:1.6;
}

/* FORM */

form{
    margin-top:28px;
}

.field{
    margin-bottom:18px;
}

label{
    display:block;

    margin-bottom:7px;

    color:rgba(255,255,255,.5);

    font-size:9px;
    font-weight:800;

    letter-spacing:2px;
}

input{
    width:100%;
    height:50px;

    padding:0 14px;

    outline:none;

    border:1px solid rgba(255,255,255,.09);

    background:rgba(0,0,0,.45);

    color:#fff;

    font-family:inherit;

    font-size:12px;

    transition:.25s;
}

input:focus{
    border-color:rgba(255,107,34,.65);

    box-shadow:
        0 0 0 3px rgba(255,107,34,.07);
}

input::placeholder{
    color:rgba(255,255,255,.2);
}

/* BUTTON */

.login-btn{
    width:100%;
    height:52px;

    margin-top:5px;

    border:0;

    background:
        linear-gradient(
            110deg,
            #ff5a16,
            #ff8738
        );

    color:#080808;

    font-family:inherit;

    font-size:10px;
    font-weight:900;

    letter-spacing:3px;

    cursor:pointer;

    transition:.25s;
}

.login-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 12px 35px rgba(255,80,20,.22);
}

/* MESSAGE */

#message{
    min-height:18px;

    margin-top:14px;

    text-align:center;

    font-size:10px;

    color:var(--orange2);
}

/* SIGNUP */

.signup{
    margin-top:24px;

    padding-top:20px;

    border-top:
        1px solid rgba(255,255,255,.07);

    text-align:center;

    color:rgba(255,255,255,.35);

    font-size:10px;
}

.signup a{
    color:#ff8738;

    text-decoration:none;

    font-weight:800;
}

/* FOOTER */

.footer{
    position:fixed;

    bottom:18px;

    width:100%;

    text-align:center;

    color:rgba(255,255,255,.18);

    font-size:8px;

    letter-spacing:3px;

    z-index:10;
}

/* MOBILE */

@media(max-width:500px){

    .topbar{
        padding:20px;
    }

    .event{
        display:none;
    }

    .card{
        padding:27px 21px;
    }

    h1{
        font-size:29px;
    }
}
</style>
</head>

<body>

<div class="background">

    <div
        class="particles"
        id="particles">
    </div>

</div>


<header class="topbar">

    <div class="logo">
        VID<span>LYRA</span>
    </div>

    <div class="event">
        HALLOWEEN FEST 2026
    </div>

</header>


<main class="page">

    <section class="card">

        <div class="badge">
            HALLOWEEN FEST 2026
        </div>

        <h1>
            WELCOME
            BACK.
        </h1>

        <p class="subtitle">
            Sign in to continue your Vidlyra journey
            and access your festival progress.
        </p>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    EMAIL ADDRESS
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="login-btn"
                type="submit"
            >
                ENTER VIDLYRA
            </button>

        </form>


        <div id="message"></div>


        <div class="signup">

            New to Vidlyra?

            <a href="signup.html">
                Create an account
            </a>

        </div>

    </section>

</main>


<div class="footer">
    VIDLYRA • WHERE IMAGINATION KNOWS NO BOUNDARIES
</div>


<script>

const particles =
    document.getElementById("particles");

for(let i = 0; i < 45; i++){

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    particle.style.animationDelay =
        (-Math.random() * 10) + "s";

    particles.appendChild(particle);
}

</script>


<script type="module">

import { supabase }
    from "./js/supabase.js";


const form =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");


form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        message.textContent =
            "Entering Vidlyra...";


        try {

            const {
                data,
                error
            } =
                await supabase.auth
                    .signInWithPassword({
                        email,
                        password
                    });


            if(error){
                throw error;
            }


            if(!data.user){

                throw new Error(
                    "Login failed."
                );

            }


            message.textContent =
                "🎃 Welcome back!";


            setTimeout(() => {

                window.location.href =
                    "map.html";

            }, 700);


        } catch(error){

            console.error(error);

            message.textContent =
                "⚠️ " + error.message;

        }

    }
);

</script>

</body>
</html>
