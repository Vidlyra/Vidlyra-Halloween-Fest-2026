<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vidlyra Halloween Fest 2026 | Day 1 Adventure</title>

    <link rel="stylesheet" href="css/adventure.css">
    <link rel="stylesheet" href="css/adventure-animations.css">

</head>

<body>

    <!-- ===========================
         BACKGROUND
    ============================ -->

    <div class="background"></div>

    <div class="background-layer"></div>

    <!-- ===========================
         CLOUDS
    ============================ -->

    <div class="cloud cloud1"></div>

    <div class="cloud cloud2"></div>

    <!-- ===========================
         CASTLE
    ============================ -->

    <div class="castle"></div>

    <!-- ===========================
         FOREST
    ============================ -->

    <img
        src="assets/images/forest.svg.png"
        class="forest"
        alt="Forest">

    <!-- ===========================
         FOG
    ============================ -->

    <div class="fog fog-back"></div>

    <div class="fog fog-front"></div>

    <!-- ===========================
         MISSION TITLE
    ============================ -->

    <div class="mission">

        <h2>🎃 Day 1 Mission</h2>

        <p>

            Find the Pumpkin Gate hidden in the haunted forest.

        </p>

    </div>

    <!-- ===========================
         PLAYER
    ============================ -->

    <div id="player">

        🧙

    </div>

    <!-- ===========================
         OBJECTS
    ============================ -->

    <img
        src="assets/images/pumpkin.png.png"
        class="pumpkin"
        alt="Pumpkin Gate">

    <img
        src="assets/images/ghost.svg"
        class="ghost"
        alt="Ghost">

    <img
        src="assets/images/Spider.svg"
        class="spider"
        alt="Spider">

    <!-- ===========================
         MISSION PANEL
    ============================ -->

    <div class="mission-panel">

        <h3>🎯 Current Mission</h3>

        <p>

            Find the Pumpkin Gate hidden in the forest.

        </p>

        <div class="progress">

            <div class="progress-fill"></div>

        </div>

    </div>

    <!-- ===========================
         CONTINUE BUTTON
    ============================ -->

    <button id="continueBtn">

        Continue Adventure

    </button>

    <!-- ===========================
         MISSION COMPLETE POPUP
    ============================ -->

    <div id="missionComplete">

        <h2>🎉 Mission Complete!</h2>

        <p>

            Pumpkin Gate Found

        </p>

    </div>

    <!-- ===========================
         AUDIO
    ============================ -->

    <audio id="bgMusic" preload="auto" loop>

        <source src="assets/ambience.mp3" type="audio/mpeg">

    </audio>

    <audio id="buttonSound">

        <source src="assets/button.mp3" type="audio/mpeg">

    </audio>
    <audio id="rewardSound">
    <source src="assets/reward.mp3" type="audio/mpeg">
    </audio>
    <!-- ===========================
         JAVASCRIPT
    ============================ -->

    <script src="js/adventure.js"></script>

</body>

</html>
