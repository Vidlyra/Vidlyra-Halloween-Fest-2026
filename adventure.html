<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Day 1 Adventure</title>

<link rel="stylesheet" href="css/adventure.css">
<link rel="stylesheet" href="css/adventure-animations.css">

</head>

<body>

<div class="background"></div>

<div class="background-layer"></div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="castle"></div>

<img
src="assets/images/forest.svg.png"
class="forest"
alt="Forest">

<div class="fog fog-back"></div>
<div class="fog fog-front"></div>

<!-- Mission -->

<div class="mission">

<h2>Mission</h2>

<p>

Find the Pumpkin Gate

</p>

</div>

<!-- Player -->

<div id="player">

🧙

</div>

<!-- Objects -->

<img
src="assets/images/pumpkin.png.png"
class="pumpkin">

<img
src="assets/images/ghost.svg"
class="ghost">

<img
src="assets/images/Spider.svg"
class="spider">
  
<div class="mission-panel">

    <h3>🎯 Current Mission</h3>

    <p>Find the Pumpkin Gate hidden in the forest.</p>

    <div class="progress">

        <div class="progress-fill"></div>

    </div>

</div>
<button id="continueBtn">

Continue

</button>

<script src="js/adventure.js"></script>
<div id="missionComplete">

    <h2>🎉 Mission Complete!</h2>

    <p>Pumpkin Gate Found</p>

</div>
</body>

</html>
