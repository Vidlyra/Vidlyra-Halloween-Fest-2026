<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        VIDLYRA HALLOWEEN FEST 2026 | DAY 4
    </title>

    <link
        rel="stylesheet"
        href="css/day4-video.css"
    >

</head>

<body>

<!-- ==========================================
START SCREEN
========================================== -->

<div id="startScreen">

    <div class="start-content">

        <div class="festival-label">
            VIDLYRA HALLOWEEN FEST 2026
        </div>

        <h1>
            DAY 4
        </h1>

        <h2>
            The Witch's Curse
        </h2>

        <p>
            Five enchanted lanterns are hidden
            throughout the forbidden forest.
            Only their light can reveal the Witch...
        </p>

        <button id="startBtn">
            ▶ Start Experience
        </button>

    </div>

</div>


<!-- ==========================================
INTRO VIDEO
========================================== -->

<video
    id="introVideo"
    playsinline
    preload="auto"
>

    <source
        src="assets/video/day4.mp4"
        type="video/mp4"
    >

    Your browser does not support HTML5 video.

</video>


<!-- ==========================================
SKIP BUTTON
========================================== -->

<button
    id="skipBtn"
    type="button"
>

    Skip Intro

</button>


<!-- ==========================================
VIDEO OVERLAY
========================================== -->

<div id="videoOverlay">

    <div class="overlay-content">

        <div class="overlay-label">
            VIDLYRA HALLOWEEN FEST 2026
        </div>

        <h1>
            DAY 4
        </h1>

        <h2>
            The Witch's Curse
        </h2>

        <p>
            Find the five enchanted lanterns
            and break the Witch's spell.
        </p>

        <button
            id="enterGame"
            type="button"
        >
            Enter The Forest
        </button>

    </div>

</div>


<!-- ==========================================
LIGHTNING
========================================== -->

<div id="lightning"></div>


<!-- ==========================================
PURPLE FOG
========================================== -->

<div id="fogLayer"></div>


<!-- ==========================================
MAGIC PARTICLES
========================================== -->

<div id="magicParticles"></div>


<!-- ==========================================
AUDIO
========================================== -->

<audio
    id="bgMusic"
    loop
    preload="auto"
>

    <source
        src="assets/witch-forest.mp3"
        type="audio/mpeg"
    >

</audio>


<audio
    id="thunderSound"
    preload="auto"
>

    <source
        src="assets/thunder.mp3"
        type="audio/mpeg"
    >

</audio>


<audio
    id="witchLaugh"
    preload="auto"
>

    <source
        src="assets/witch-laugh.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- ==========================================
JAVASCRIPT
========================================== -->

<script
    type="module"
    src="js/day4-video.js"
></script>

</body>

</html>
