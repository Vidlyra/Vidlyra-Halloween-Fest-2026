<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05030D">
    <meta name="description" content="VIDLYRA Halloween Fest 2026 - Day 4: The Witch's Curse">

    <title>VIDLYRA HALLOWEEN FEST 2026 | DAY 4</title>

    <link rel="stylesheet" href="css/day4-video.css">
</head>

<body>

    <!-- Intro video: NO autoplay and NO loop.
         "loop" would stop the "ended" event from ever firing,
         and "autoplay" would run the intro behind the start screen. -->
    <video
        id="bgVideo"
        class="bg-video"
        muted
        playsinline
        preload="auto"
        disablepictureinpicture
        aria-hidden="true"
    >
        <source src="assets/video/day4.mp4" type="video/mp4">
    </video>

    <!-- START SCREEN -->
    <div id="startScreen">
        <div class="start-content">

            <div class="festival-label">VIDLYRA HALLOWEEN FEST 2026</div>

            <h1>DAY 4</h1>
            <h2>The Witch's Curse</h2>

            <p>
                Five enchanted lanterns are hidden
                throughout the forbidden forest.
                Only their light can reveal the Witch...
            </p>

            <!-- Disabled until JS has verified login + Day 3 -->
            <button id="startBtn" type="button" disabled>
                Checking access…
            </button>

            <div id="statusMsg" class="status-msg" role="status" aria-live="polite"></div>

        </div>
    </div>

    <!-- SKIP INTRO -->
    <button id="skipBtn" type="button">Skip Intro</button>

    <!-- VIDEO ENDING OVERLAY -->
    <div id="videoOverlay" hidden>
        <div class="overlay-content">

            <div class="overlay-label">VIDLYRA HALLOWEEN FEST 2026</div>

            <h1>DAY 4</h1>
            <h2>The Witch's Curse</h2>

            <p>
                Find the five enchanted lanterns
                and break the Witch's spell.
            </p>

            <button id="enterGame" type="button">Enter The Forest</button>

        </div>
    </div>

    <!-- ATMOSPHERIC EFFECTS -->
    <div id="lightning" aria-hidden="true"></div>
    <div id="fogLayer" aria-hidden="true"></div>
    <div id="magicParticles" aria-hidden="true"></div>

    <!-- AUDIO -->
    <audio id="bgMusic" loop preload="auto">
        <source src="assets/witch-forest.mp3" type="audio/mpeg">
    </audio>

    <audio id="thunderSound" preload="auto">
        <source src="assets/thunder.mp3" type="audio/mpeg">
    </audio>

    <audio id="witchLaugh" preload="auto">
        <source src="assets/witch-laugh.mp3" type="audio/mpeg">
    </audio>

    <script type="module" src="js/day4-video.js"></script>

</body>
</html>
