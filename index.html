<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vidlyra Halloween Fest 2026</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #050008;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

body {
    min-height: 100vh;
}

.intro {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
        radial-gradient(circle at center, rgba(100, 0, 130, .25), transparent 45%),
        linear-gradient(180deg, #09000f, #020003);
    z-index: 10;
}

.intro-box {
    width: min(90%, 700px);
    padding: 35px 20px;
}

.symbol {
    font-size: clamp(50px, 10vw, 90px);
    animation: float 3s ease-in-out infinite;
}

.logo {
    margin-top: 10px;
    font-size: clamp(42px, 10vw, 90px);
    font-weight: 900;
    letter-spacing: .12em;
    text-shadow:
        0 0 10px #ff6600,
        0 0 30px #ff3300,
        0 0 70px #7700ff;
}

.title {
    margin-top: 10px;
    font-size: clamp(20px, 5vw, 38px);
    letter-spacing: .25em;
    color: #ff8a00;
}

.subtitle {
    margin-top: 22px;
    color: #c9b9d5;
    font-size: clamp(14px, 3vw, 19px);
    letter-spacing: .08em;
}

.enter {
    margin-top: 40px;
    padding: 16px 30px;
    border: 1px solid #ff7700;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff7200, #9c00ff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow:
        0 0 15px rgba(255, 100, 0, .6),
        0 0 35px rgba(130, 0, 255, .3);
    transition: .25s ease;
}

.enter:hover {
    transform: scale(1.06);
    box-shadow:
        0 0 25px rgba(255, 100, 0, .8),
        0 0 55px rgba(130, 0, 255, .5);
}

.loading {
    margin-top: 22px;
    color: #8e7d99;
    font-size: 12px;
    letter-spacing: .15em;
}

.footer {
    position: fixed;
    bottom: 15px;
    width: 100%;
    text-align: center;
    color: #675a70;
    font-size: 11px;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

@media (max-width: 600px) {
    .intro-box {
        padding: 20px;
    }

    .enter {
        width: 90%;
    }
}
</style>
</head>

<body>

<div class="intro">

    <div class="intro-box">

        <div class="symbol">🎃</div>

        <div class="logo">VIDLYRA</div>

        <div class="title">
            HALLOWEEN FEST 2026
        </div>

        <div class="subtitle">
            Beyond the Veil
        </div>

        <button class="enter" id="enterButton">
            ENTER THE FEST
        </button>

        <div class="loading" id="loadingText">
            THE HAUNTED REALM AWAITS...
        </div>

    </div>

</div>

<div class="footer">
    © 2026 VIDLYRA STUDIO
</div>

<script>
"use strict";

const enterButton = document.getElementById("enterButton");
const loadingText = document.getElementById("loadingText");

enterButton.addEventListener("click", function () {

    enterButton.disabled = true;

    loadingText.textContent = "OPENING THE HAUNTED REALM...";

    document.body.style.transition = "opacity 0.8s ease";
    document.body.style.opacity = "0";

    setTimeout(function () {
        window.location.href = "home.html";
    }, 800);

});
</script>

</body>
</html>
