<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join Vidlyra Halloween Fest 2026</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                radial-gradient(circle at top, #351406, transparent 45%),
                #050505;

            color: white;
            font-family: Arial, sans-serif;
        }

        .signup-card {
            width: min(420px, 100%);
            padding: 35px 28px;

            background: rgba(12, 12, 12, .94);
            border: 1px solid rgba(255, 113, 53, .35);

            box-shadow:
                0 0 40px rgba(255, 80, 20, .12);
        }

        .logo {
            text-align: center;
            color: #ff7135;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 5px;
        }

        h1 {
            margin-top: 15px;
            text-align: center;
            font-size: 30px;
        }

        .subtitle {
            margin-top: 10px;
            text-align: center;
            color: rgba(255,255,255,.55);
            font-size: 12px;
        }

        form {
            margin-top: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 11px;
            color: rgba(255,255,255,.65);
        }

        input {
            width: 100%;
            padding: 13px;

            margin-bottom: 18px;

            background: #0b0b0b;
            color: white;

            border: 1px solid rgba(255,255,255,.12);
            outline: none;
        }

        input:focus {
            border-color: #ff7135;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            background: #ff7135;
            color: #050505;

            font-weight: 900;
            letter-spacing: 2px;

            cursor: pointer;
        }

        button:hover {
            background: white;
        }

        #message {
            min-height: 20px;
            margin-top: 18px;

            text-align: center;
            font-size: 12px;
        }

        .login-link {
            margin-top: 22px;
            text-align: center;

            font-size: 12px;
            color: rgba(255,255,255,.5);
        }

        .login-link a {
            color: #ff7135;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="signup-card">

        <div class="logo">
            VIDLYRA
        </div>

        <h1>JOIN THE FEST</h1>

        <p class="subtitle">
            Create your account for Halloween Fest 2026
        </p>

        <form id="signupForm">

            <label for="username">
                USERNAME
            </label>

            <input
                id="username"
                type="text"
                placeholder="Your Vidlyra name"
                required
            >

            <label for="email">
                EMAIL
            </label>

            <input
                id="email"
                type="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">
                PASSWORD
            </label>

            <input
                id="password"
                type="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <button type="submit">
                CREATE ACCOUNT
            </button>

        </form>

        <div id="message"></div>

        <div class="login-link">
            Already have an account?
            <a href="login.html">LOGIN</a>
        </div>

    </main>

    <script type="module">

        // We will connect Supabase here in the next step.

        const form = document.getElementById("signupForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", (event) => {

            event.preventDefault();

            message.textContent =
                "Supabase connection coming in Step 3...";

        });

    </script>

</body>
</html>
