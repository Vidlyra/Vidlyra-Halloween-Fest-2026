<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
VIDLYRA HALLOWEEN FEST 2026 - DAY 5
</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

overflow:hidden;
background:black;
font-family:Arial, sans-serif;

}



#videoContainer{

width:100vw;
height:100vh;
position:relative;

}



video{

width:100%;
height:100%;

object-fit:cover;

}



/* END OVERLAY */


#endOverlay{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

background:

rgba(0,0,0,0.75);


display:flex;

justify-content:center;

align-items:center;

flex-direction:column;


opacity:0;

pointer-events:none;

transition:1.5s;


}


#endOverlay.show{

opacity:1;

pointer-events:auto;

}



#endOverlay h1{


color:white;

font-size:clamp(30px,5vw,70px);

text-align:center;

letter-spacing:5px;


animation:pulse 2s infinite;


}



#endOverlay p{

margin-top:25px;

color:#ff8800;

font-size:clamp(16px,2vw,30px);

}



@keyframes pulse{


0%,100%{

transform:scale(1);

}


50%{

transform:scale(1.08);

}


}



</style>


</head>


<body>



<div id="videoContainer">


<video

id="day5Video"

autoplay

muted

playsinline>


<source

src="assets/video/day5-intro.mp4"

type="video/mp4">


</video>





<div id="endOverlay"

onclick="enterGame()">



<h1>

THE HAUNTED CEMETERY

</h1>


<p>

CLICK TO ENTER DAY 5

</p>



</div>



</div>





<script>


const video =
document.getElementById("day5Video");


const overlay =
document.getElementById("endOverlay");





// SHOW OVERLAY WHEN VIDEO ENDS


video.addEventListener(

"ended",

()=>{


overlay.classList.add("show");


}

);





// REDIRECT TO GAME


function enterGame(){


window.location.href="day5-game.html";


}




</script>



</body>

</html>
