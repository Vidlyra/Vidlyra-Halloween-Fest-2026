<body>

<!-- ==========================
DAY 2 INTRO
========================== -->

<div id="introScreen">

    <div class="intro-content">

        <h1>DAY 2</h1>

        <h2>The Haunted Well</h2>

        <p id="introText">

            Something ancient sleeps beneath the water...

        </p>

    </div>

</div>

<!-- ==========================
FLASH EFFECT
========================== -->

<div id="flash"></div>

<!-- ==========================
PARTICLES
========================== -->

<div id="particles"></div>

<!-- ==========================
BACKGROUND
========================== -->

<div class="background"></div>

<div class="background-layer"></div>

<!-- ==========================
CASTLE
========================== -->

<img
src="assets/images/castle 2.png"
class="castle"
alt="Castle">

<!-- ==========================
BLUE FOG
========================== -->

<img
src="assets/images/blue_fog.png"
class="fog fog-back"
alt="Fog">

<img
src="assets/images/blue_fog.png"
class="fog fog-front"
alt="Fog">

<!-- ==========================
STONE CIRCLE
========================== -->

<img
src="assets/images/stone-circle.png"
class="stone-circle"
alt="Stone Circle">

<!-- ==========================
HAUNTED WELL
========================== -->

<img
src="assets/images/well.png"
class="well"
alt="Haunted Well">

<!-- ==========================
WATER RIPPLE
========================== -->

<img
src="assets/images/water_ripple.png"
class="ripple"
alt="Water Ripple">

<!-- ==========================
BLUE FIRE
========================== -->

<img
src="assets/images/blue_fire.png"
class="fire fire-left"
alt="Blue Fire">

<img
src="assets/images/blue_fire.png"
class="fire fire-right"
alt="Blue Fire">

<!-- ==========================
CANDLES
========================== -->

<img
src="assets/images/candle.png"
class="candle candle-left"
alt="Candle">

<img
src="assets/images/candle 2.png"
class="candle candle-right"
alt="Candle">

<!-- ==========================
SKULLS
========================== -->

<img
src="assets/images/skull.png"
class="skull skull-left"
alt="Skull">

<img
src="assets/images/skull.png"
class="skull skull-right"
alt="Skull">

<!-- ==========================
PUMPKIN
========================== -->

<img
src="assets/images/smile pumpkin.png"
class="pumpkin"
alt="Pumpkin">

<!-- ==========================
WITCH HAT
========================== -->

<img
src="assets/images/witch hat and candile.png"
class="witch"
alt="Witch Hat">

<!-- ==========================
RUNES
========================== -->

<img
src="assets/images/rune1.png"
class="rune rune1"
alt="Rune 1">

<img
src="assets/images/rune2.png"
class="rune rune2"
alt="Rune 2">

<img
src="assets/images/rune3.png"
class="rune rune3"
alt="Rune 3">

<!-- ==========================
GHOST
========================== -->

<img
src="assets/images/ghost_blue.png"
class="ghost"
alt="Ghost">

<!-- ==========================
MAGIC CRYSTAL
========================== -->

<img
src="assets/images/magic_crystal.png"
class="crystal"
alt="Crystal">

  <!-- ==========================
PLAYER
========================== -->

<div id="player">

🧙

</div>

<!-- ==========================
MISSION PANEL
========================== -->

<div class="mission-panel">

    <h3>🎯 Day 2 Mission</h3>

    <p>

        Find all three Ancient Runes to awaken the Haunted Well.

    </p>

    <div class="progress">

        <div class="progress-fill" id="progressFill"></div>

    </div>

    <div class="runeCounter" id="runeCounter">

        🔷 Ancient Runes : 0 / 3

    </div>

</div>

<!-- ==========================
DIALOG BOX
========================== -->

<div id="dialogBox">

    <p id="dialogText">

        Explore the Haunted Well...

    </p>

</div>

<!-- ==========================
MISSION COMPLETE
========================== -->

<div id="missionComplete">

    <h2>

        🎉 Mission Complete!

    </h2>

    <p>

        The Haunted Well has awakened.

    </p>

    <button id="nextBtn">

        Continue to Day 3

    </button>

</div>

<!-- ==========================
SCREEN GLOW
========================== -->

<div id="screenGlow"></div>

<!-- ==========================
SHAKE LAYER
========================== -->

<div id="shakeLayer"></div>

<!-- ==========================
AUDIO
========================== -->

<audio id="bgMusic" loop>

    <source
    src="assets/ambience.mp3"
    type="audio/mpeg">

</audio>

<audio id="ghostWhisper">

    <source
    src="assets/ghost-whisper.mp3"
    type="audio/mpeg">

</audio>

<audio id="wellRumble">

    <source
    src="assets/well-rumble.mp3"
    type="audio/mpeg">

</audio>

<audio id="magicSound">

    <source
    src="assets/magic.mp3"
    type="audio/mpeg">

</audio>

<audio id="rewardSound">

    <source
    src="assets/reward.mp3"
    type="audio/mpeg">

</audio>

<!-- ==========================
JAVASCRIPT
========================== -->

<script src="js/day2-game.js"></script>

</body>

</html>
