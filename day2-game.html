<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Vidlyra Halloween Fest 2026 | Day 2</title>

<link rel="stylesheet" href="css/day2-game.css">

<link rel="stylesheet" href="css/day2-game-animations.css">

</head>

<body>

<!-- ==========================
BACKGROUND
========================== -->

<div class="background"></div>

<div class="background-layer"></div>

<!-- ==========================
CASTLE
========================== -->

<img
src="assets/images/castle 2.png"
class="castle"
alt="Castle">

<!-- ==========================
BLUE FOG
========================== -->

<img
src="assets/images/blue_fog.png"
class="fog fog-back"
alt="Fog">

<img
src="assets/images/blue_fog.png"
class="fog fog-front"
alt="Fog">

<!-- ==========================
STONE CIRCLE
========================== -->

<img
src="assets/images/stone-circle.png"
class="stone-circle"
alt="Stone Circle">

<!-- ==========================
HAUNTED WELL
========================== -->

<img
src="assets/images/well.png"
class="well"
alt="Haunted Well">

<!-- ==========================
WATER RIPPLE
========================== -->

<img
src="assets/images/water_ripple.png"
class="ripple"
alt="Water Ripple">

<!-- ==========================
BLUE FIRE
========================== -->

<img
src="assets/images/blue_fire.png"
class="fire fire-left"
alt="Blue Fire">

<img
src="assets/images/blue_fire.png"
class="fire fire-right"
alt="Blue Fire">

<!-- ==========================
CANDLES
========================== -->

<img
src="assets/images/candle.png"
class="candle candle-left"
alt="Candle">

<img
src="assets/images/candle 2.png"
class="candle candle-right"
alt="Candle">

<!-- ==========================
SKULLS
========================== -->

<img
src="assets/images/skull.png"
class="skull skull-left"
alt="Skull">

<img
src="assets/images/skull.png"
class="skull skull-right"
alt="Skull">

<!-- ==========================
PUMPKIN
========================== -->

<img
src="assets/images/smile pumpkin.png"
class="pumpkin"
alt="Pumpkin">

<!-- ==========================
WITCH HAT
========================== -->

<img
src="assets/images/witch hat and candile.png"
class="witch"
alt="Witch Hat">

<!-- ==========================
RUNES
========================== -->

<img
src="assets/images/rune1.png"
class="rune rune1"
alt="Rune 1">

<img
src="assets/images/rune2.png"
class="rune rune2"
alt="Rune 2">

<img
src="assets/images/rune3.png"
class="rune rune3"
alt="Rune 3">

<!-- ==========================
GHOST
========================== -->

<img
src="assets/images/ghost_blue.png"
class="ghost"
alt="Blue Ghost">

<!-- ==========================
MAGIC CRYSTAL
========================== -->

<img
src="assets/images/magic_crystal.png"
class="crystal"
alt="Magic Crystal">

<!-- ==========================
PLAYER
========================== -->

<div id="player">

🧙

</div>

<!-- ==========================
MISSION PANEL
========================== -->

<div class="mission-panel">

<h3>Day 2 Mission</h3>

<p>

Find all three Ancient Runes to awaken the Haunted Well.

</p>

<div class="progress">

<div class="progress-fill"></div>

</div>

</div>

<!-- ==========================
MISSION COMPLETE
========================== -->

<div id="missionComplete">

<h2>

🎉 Mission Complete

</h2>

<p>

The Haunted Well has awakened.

</p>

<button id="nextBtn">

Continue

</button>

</div>

<!-- ==========================
AUDIO
========================== -->

<audio
id="bgMusic"
loop>

<source
src="assets/ambience.mp3"
type="audio/mpeg">

</audio>

<audio
id="rewardSound">

<source
src="assets/reward.mp3"
type="audio/mpeg">

</audio>

<!-- ==========================
JAVASCRIPT
========================== -->

<script src="js/day2-game.js"></script>

</body>

</html>
